<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Card</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');
        *{box-sizing: border-box;}
        body {
            margin: 0;
            min-height:100vh;
            font-family: 'Pacifico', cursive ;
            background: linear-gradient(135deg,#0a1a3a,#162b5c,#1f3c88);
            overflow-x: hidden;
        }
        .wrapper{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        .card{
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            padding: 50px 60px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        h1{
            font-size:3.5rem ;
            margin-bottom: 15px;
            animation: popIn 1s ease forwards;

        }
        p{
            font-size: 1.3rem;
            opacity: 0;
            animation: fadeIn 2s ease forwards;
            animation-delay: .6s;
        }
        .qr{
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .qr img{
            width: 30px;
            max-width: 30%;
            border-radius: 12px;
            background: white;
            padding: 6px;
            box-sizing: 0 8px 20px rgba(0,0,0,0.25);
        }
        .qr img{
            box-shadow: 0 0 15px rgba(255, 182,213, 0.8);
        }
        .balloons{
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        .balloon{
            position: absolute;
            bottom: -120px;
            width: 60px;
            height: 80px;
            border-radius: 50%;
            animation: floatUp 6s ease forwards;            
        }
        .balloon::after{
            content: "";
            position: absolute;
            bottom: -20px;
            left: 50%;
            width: 2px;
            height: 25px;
            background: rgba(0,0,0,.3);
            transform: translateX(-50%);
        }
        .balloon:nth-child(1){
            left: 20%;
            background:#ff9ad5 ;
        }
        .balloon:nth-child(2){
            left:20% ;
            background:#8fd3ff ;
            animation-delay: .6s;
        }
        .balloon:nth-child(3){
            left:60% ;
            background: #c3a6ff;
            animation-delay: 1.2s;
        }
        .balloon:nth-child(4){
            left:80% ;
            background:#ffb3ec ;
            animation-delay: 1.8s;
        }
        .balloon:nth-child(5){
            left:90% ;
            background:#110442 ;
            animation-delay: 2s;
        }
        .balloon:nth-child(6){
            left:50% ;
            background:#709616 ;
            animation-delay: 1s;
        }
        
            

        @keyframes floatUp{
            from{
                transform: translateY(0);
            }
            to{
                transform: translateY(-120vh);
            }
        }
        @keyframes popIn{
            from{ transform: scale(.5); opacity: 0;}
            to{ transform: scale(1); opacity: 1;}
        }
        @keyframes fadeIn{
            to{ opacity: 1;}
        }

        @media (max-width:20px){
            .qr img{
                width:50px
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <h1>Happy BirthdayYYYYYY 🎉🎊</h1>
            <p>oi youuyy olddddd🎂<br><br>
                baby ko please after reading this 
                DELETEEEEE IT and never look back
            </p>
            <div class="qr.png">
                <img src="qr.png" alt="QR Code">
            </div>
        </div>
    </div>
    <div class="balloons">
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
    </div>


</body>

</html>
