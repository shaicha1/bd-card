<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories 💗</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');
        body{
            margin: 0;
            min-height: 100vh;
            font-family: 'Pacifico', cursive;
            background: linear-gradient(135deg, #3a0b2e, #7b1e5a);
            color: #ffd6ea;
            text-align: center;
            padding: 40px;
        }
        .gallery{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px,1fr));
            gap: 15px;
            margin: 30px 0;
        }
        .gallery img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,.4);
        }
        .letter{
            max-width: 600px;
            margin: auto;
            background: rgba(255,182,213,0.15);
            padding: 30px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <h1>Our Memories 💓</h1>
    <div class="gallery">
        <img src="img1.jpg">
        <img src="img2.jpg">
        <img src="img3.jpg">
        <img src="img4.jpg">
    </div>
    <div class="letter">
        <p>
            Dear langga 💗<br><br>
            thank you for being such a beautiful part of my life.
            Every memory with you is something i'll always cherish and carry them with me 
            i hope this year brings you happiness , love , and dreaam coming true✨

        </p>
    </div>
    
</body>
</html>
